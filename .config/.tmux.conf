# battery
# set -ga status-right "#[fg=#{@thm_pink},bg=default]"
# set -ga status-right "#{?#{e|>:#{window_width},105},"
# set -ga status-right " #{?#{battery_percentage},#{battery_icon} #{battery_percentage},#{@batt_icon_status_charged} cable} "
